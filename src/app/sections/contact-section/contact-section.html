<section class="contact" id="contact" aria-labelledby="contact-title">
  <p class="contact-kicker">Available for good conversations</p>
  <h2 class="display-heading contact-heading" id="contact-title">
    Have an idea<br />with <em>energy?</em>
  </h2>
  <a class="contact-button" [href]="email">
    <span>Start a conversation</span>
    <span aria-hidden="true">✉</span>
  </a>
  <footer class="site-footer">
    <p>Victor Falck-Næss · Oslo, Norway</p>
    <nav aria-label="Social links">
      @for (link of socialLinks; track link.label) {
        <a
          [href]="link.href"
          target="_blank"
          rel="noopener noreferrer"
          [attr.aria-label]="link.label"
        >
          {{ link.shortLabel }}
        </a>
      }
    </nav>
    <a href="#top">Back to top ↑</a>
  </footer>
</section>
